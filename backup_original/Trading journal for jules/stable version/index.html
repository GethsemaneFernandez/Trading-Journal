    /* ══════════════════════════════════════════

    function useToasts() {
      var _s = useState([]); var list = _s[0]; var setList = _s[1];
      var add = useCallback(function (msg, type) {
        type = type || 'ok';
        var id = Date.now() + Math.random();
        setList(function (p) { return p.concat([{ id: id, msg: msg, type: type, out: false }]); });

        setTimeout(function () { setList(function (p) { return p.filter(function (t) { return t.id !== id; }); }); }, 3500);
      }, []);
      return [list, add];
    }

    /* ══════════════════════════════════════════
       PIE CHART
       Vibrant colours only — no black slices.
    ══════════════════════════════════════════ */
    function PieChart(props) {
      var data = props.data, size = props.size || 180, isDark = props.isDark, title = props.title || '';
      var colorFn = props.colorFn;   /* optional per-item colour override */
      var _h = useState(null); var hov = _h[0]; var setHov = _h[1];
      var total = data.reduce(function (s, d) { return s + Math.abs(d.v); }, 0);

      if (!total) return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: size, opacity: .3 }}>
          <span className="tm" style={{ fontSize: 10 }}>No data</span>
        </div>
      );

      var r = size / 2 - 10, cx = size / 2, cy = size / 2;
      function xy(a, rad) { var rr = a * Math.PI / 180; return [cx + rad * Math.cos(rr), cy + rad * Math.sin(rr)]; }
      var cum = -90;
      var slices = data.map(function (d, i) {
        var color = colorFn ? colorFn(d) : PIE_COLORS[i % PIE_COLORS.length];
        var angle = (Math.abs(d.v) / total) * 360;
        var sa = cum; cum += angle; var ea = cum - .3;
        var lg = angle > 180 ? 1 : 0;
        var s1 = xy(sa, r); var e1 = xy(ea, r);
        var path = angle >= 359.9
          ? ('M' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 1 1 ' + (cx - .001) + ' ' + (cy - r) + 'Z')
          : ('M' + cx + ' ' + cy + ' L' + s1[0] + ' ' + s1[1] + ' A' + r + ' ' + r + ' 0 ' + lg + ' 1 ' + e1[0] + ' ' + e1[1] + 'Z');
        return { label: d.label, v: d.v, path: path, color: color, pctVal: ((Math.abs(d.v) / total) * 100).toFixed(1) };
      });

      return (
        <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start', width: '100%' }}>
          <div style={{ flexShrink: 0 }}>
            <svg width={size} height={size} viewBox={'0 0 ' + size + ' ' + size} style={{ filter: 'drop-shadow(0 4px 14px rgba(0,0,0,.30))' }}>
              <defs>{slices.map(function (s, i) {
                return (<radialGradient key={i} id={'bj151pie_' + i + '_' + title.replace(/\W/g, '_')} cx="38%" cy="28%" r="72%">
                  <stop offset="0%" stopColor={s.color} stopOpacity="1" />
                  <stop offset="100%" stopColor={s.color} stopOpacity=".55" />
                </radialGradient>);
              })}</defs>
              {slices.map(function (s, i) {
                var isH = hov === s.label;
                return (<path key={i} d={s.path}
                  fill={'url(#bj151pie_' + i + '_' + title.replace(/\W/g, '_') + ')'}
                  stroke={isDark ? 'rgba(5,5,5,.6)' : 'rgba(255,255,255,.5)'} strokeWidth="1.5"
                  opacity={hov === null || isH ? 1 : .45}
                  style={{ filter: isH ? 'brightness(1.22) drop-shadow(0 0 8px ' + s.color + ')' : 'none', cursor: 'pointer', transition: 'all .2s' }}
                  onMouseEnter={function () { setHov(s.label); }}
                  onMouseLeave={function () { setHov(null); }}>
                  <title>{s.label}: {s.pctVal}%</title>
                </path>);
              })}
              <circle cx={cx} cy={cy} r={r * .40} fill="var(--pie-hole)" />
              <text x={cx} y={cy - 4} textAnchor="middle" style={{ fontSize: 11, fontWeight: 700, fontFamily: 'JetBrains Mono,monospace' }} fill="var(--pie-txt)">{data.length}</text>
              <text x={cx} y={cy + 8} textAnchor="middle" style={{ fontSize: 7, fontFamily: 'Inter,sans-serif' }} fill="var(--pie-txt-sub)">{title}</text>
            </svg>
          </div>
          <div className="pie-legend scroll" style={{ flex: 1, padding: '4px 2px', maxHeight: size, overflow: 'auto' }}>
            {slices.map(function (s, i) {
              var isH = hov === s.label;
              return (
                <div key={i} className="pie-legend-row"
                  style={{ opacity: hov === null || isH ? 1 : .45, transition: 'opacity .15s' }}
                  onMouseEnter={function () { setHov(s.label); }}
                  onMouseLeave={function () { setHov(null); }}>
                  <div style={{ width: 7, height: 7, borderRadius: 2, background: s.color, flexShrink: 0, boxShadow: '0 0 5px ' + s.color + '66' }} />
                  <span className="mono ts" style={{ fontSize: 9.5, fontWeight: 600, flex: 1 }}>{s.label}</span>
                  <span className="mono" style={{ fontSize: 8.5, color: s.color, fontWeight: 700 }}>{s.pctVal}%</span>

      );
    }

    /* ══════════════════════════════════════════

    ══════════════════════════════════════════ */
    function TrendChart(props) {
      var data = props.data || []; var isDark = props.isDark;
      if (!data.length) return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 72, opacity: .28 }}>

          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       EQUITY CURVE
    ══════════════════════════════════════════ */
    function EquityCurve(props) {
      var points = props.points || [], height = props.height || 72, width = props.width || 300;
      if (points.length < 2) return <Empty msg="Not enough data" />;
      var mn = Math.min.apply(null, points), mx = Math.max.apply(null, points), rng = mx - mn || 1;
      var pts = points.map(function (v, i) {
        var x = i / (points.length - 1) * width;
        var y = height - ((v - mn) / rng) * (height - 12) - 2;
        return x.toFixed(1) + ',' + y.toFixed(1);
      });
      var polyline = pts.join(' ');
      var fill = pts.join(' ') + ' ' + width + ',' + (height) + ' 0,' + (height);
      var lastVal = points[points.length - 1];
      var color = lastVal >= points[0] ? '#c7e2f7' : '#f43f5e';
      return (
        <div style={{ position: 'relative' }}>
          <svg width="100%" height={height} viewBox={'0 0 ' + width + ' ' + height} preserveAspectRatio="none">
            <defs>
              <linearGradient id="eqgrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={color} stopOpacity="0.3" />
                <stop offset="100%" stopColor={color} stopOpacity="0.02" />
              </linearGradient>
            </defs>
            <polygon points={fill} fill="url(#eqgrad)" />
            <polyline points={polyline} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" />
          </svg>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       P&L HEATMAP
    ══════════════════════════════════════════ */
    function PnLHeatmap(props) {
      var cashTrailData = props.cashTrailData || [];
      var dayMap = {};
      cashTrailData.forEach(function (d) {
        if (d.kind === 'profit' || d.kind === 'loss') {
          dayMap[d.date] = (dayMap[d.date] || 0) + d.pnl;
        }
      });
      var today = new Date();
      var months = [];
      for (var mi = 11; mi >= 0; mi--) {
        var d = new Date(today.getFullYear(), today.getMonth() - mi, 1);
        months.push({ year: d.getFullYear(), month: d.getMonth() });
      }
      var MONTHS = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
      return (
        <div style={{ overflowX: 'auto', paddingBottom: 4 }}>
          <div style={{ display: 'flex', gap: 4, alignItems: 'flex-start' }}>
            {months.map(function (m, mi) {
              var days = new Date(m.year, m.month + 1, 0).getDate();
              var cells = [];
              for (var di = 1; di <= days; di++) {
                var ds = m.year + '-' + ('0' + (m.month + 1)).slice(-2) + '-' + ('0' + di).slice(-2);
                var pnl = dayMap[ds];
                var col = pnl === undefined ? 'rgba(255,255,255,0.04)' : pnl > 0 ? '#c7e2f7' : pnl < 0 ? '#f43f5e' : '#334155';
                var op = pnl !== undefined ? Math.min(1, Math.abs(pnl) / 5000 * 0.8 + 0.3) : 1;
                cells.push(<div key={di} title={ds + (pnl !== undefined ? ' ₱' + f2(pnl) : '')}
                  style={{ width: 6, height: 6, borderRadius: 1, background: col, opacity: pnl !== undefined ? op : 1, margin: '0.5px' }} />);
              }
              return (
                <div key={mi} style={{ display: 'flex', flexDirection: 'column', gap: 1, alignItems: 'center' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', flexWrap: 'wrap', height: 48, gap: '0.5px' }}>{cells}</div>
                  <span style={{ fontSize: 6, color: '#475569', marginTop: 2 }}>{MONTHS[m.month]}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════

    /* ══════════════════════════════════════════
       TICKER DROPDOWN   V1.5.1
       forceList:  when SELL mode passes only qty>0 tickers
       isForexMode: shows pair format hint
    ══════════════════════════════════════════ */
    function TickerDropdown(props) {
      var exchange = props.exchange, tickers = props.tickers, value = props.value;
      var onChange = props.onChange, onDelete = props.onDelete, onAdd = props.onAdd;
      var forceList = props.forceList;
      var _o = useState(false); var open = _o[0]; var setOpen = _o[1];
      var _q = useState(''); var query = _q[0]; var setQuery = _q[1];
      var wRef = useRef(null); var sRef = useRef(null);
      useEffect(function () {
        function h(e) { if (wRef.current && !wRef.current.contains(e.target)) setOpen(false); }
        document.addEventListener('mousedown', h);
        return function () { document.removeEventListener('mousedown', h); };
      }, []);
      useEffect(function () { if (open && sRef.current) sRef.current.focus(); }, [open]);

      var baseList = forceList || tickers;
      var qUp = query.toUpperCase().trim();
      var filtered = useMemo(function () {
        return qUp ? baseList.filter(function (t) { return t.toUpperCase().includes(qUp); }) : baseList;
      }, [baseList, qUp]);
      var isNew = !forceList && qUp && !baseList.map(function (t) { return t.toUpperCase(); }).includes(qUp);

            </div>

      return (

          {/* Right: Scenarios */}
          <div className="panel scroll" style={{ padding: 16 }}>

    /* ══════════════════════════════════════════
       DASHBOARD BODY  — shared by Live + Mock

    function DashboardBody(props) {
      var enriched = props.enriched, port = props.port, trades = props.trades, funding = props.funding;
      var tickerLists = props.tickerLists, mktPx = props.mktPx, setMktPx = props.setMktPx;

      var isDark = props.isDark, priv = props.priv, scale = props.scale;
      var addTicker = props.addTicker, deleteTicker = props.deleteTicker;
      var onExecTrade = props.onExecTrade, isMock = props.isMock || false;
      var savedScenarios = props.savedScenarios, setSavedScenarios = props.setSavedScenarios, addToast = props.addToast;
      var saveTrades = props.saveTrades;

      var totalMVPHP = useMemo(function () { return enriched.reduce(function (s, p) { return s + p.mvPHP; }, 0); }, [enriched]);
      var totalEqPHP = port.cashPHP + totalMVPHP;
      var advMetrics = useMemo(function () {
        return _E.getAdvancedMetrics ? _E.getAdvancedMetrics(trades, funding, fxRate) : null;
      }, [trades, funding, fxRate]);
      var compact = scale === 'compact';

      var _pf = useState(null); var prefill = _pf[0]; var setPrefill = _pf[1];
      var _ac = useState(false); var isAnalyticsCollapsed = _ac[0]; var setAnalyticsCollapsed = _ac[1];
      var _as = useState(false); var isAnalyticsCompact = _as[0]; var setAnalyticsCompact = _as[1];
      var _ami = useState(false); var isAnalyticsMinimized = _ami[0]; var setAnalyticsMinimized = _ami[1];
      var _ama = useState(false); var isAnalyticsMaximized = _ama[0]; var setAnalyticsMaximized = _ama[1];
      var _ito = useState(false); var isTradeOpen = _ito[0]; var setTradeOpen = _ito[1];

      /* Cash Trail — full chronological ledger with narrative storytelling */
      var cashTrailData = useMemo(function () {
        var allRaw = [];
        funding.forEach(function (f) {
          if (!f || !f.date) return;
          allRaw.push({ _t: f.date + 'T' + (f.time || '00:00'), date: f.date, time: f.time || '', kind: f.type === 'DEPOSIT' ? 'deposit' : 'withdraw', amount: parseFloat(f.amount) || 0, source: f.source || '', notes: f.notes || '' });
        });
        trades.filter(function (t) { return t && t.ticker && t.price && t.qty; }).forEach(function (t) {
          var k = (t.type || '').toUpperCase() === 'BUY' ? 'buy' : 'sell';
          allRaw.push({ _t: (t.date || '') + 'T' + (t.time || '00:00'), date: t.date || '', time: t.time || '', kind: k, ticker: t.ticker, price: parseFloat(t.price) || 0, qty: parseFloat(t.qty) || 0, exchange: t.exchange || 'PSE', notes: t.notes || '' });
        });
        allRaw.sort(function (a, b) { return a._t.localeCompare(b._t); });
        var runCash = 0;
        var pos = {};
        return allRaw.map(function (ev) {
          var out = Object.assign({}, ev);
          var ex = ev.exchange || 'PSE';
          var sym = ex === 'PSE' ? '\u20b1' : '$';
          if (ev.kind === 'deposit') {
            out.cashBefore = runCash; runCash += ev.amount; out.cashAfter = runCash;
            out.flowAmt = ev.amount;
            out.story = 'Cash in' + (ev.source ? ' via ' + ev.source : '') + ': \u20b1' + f2(ev.amount) + '. Available cash \u2192 \u20b1' + f2(runCash) + '.';
          } else if (ev.kind === 'withdraw') {
            out.cashBefore = runCash; runCash -= ev.amount; out.cashAfter = runCash;
            out.flowAmt = -ev.amount;
            out.story = 'Withdrawal of \u20b1' + f2(ev.amount) + '. Remaining \u2192 \u20b1' + f2(runCash) + '.';
          } else if (ev.kind === 'buy') {
            var bFee = calcFee('BUY', ev.price, ev.qty, psiFee, ex);
            var bCost = toPHP(ev.price * ev.qty + bFee, ex, fxRate);
            if (!pos[ev.ticker]) pos[ev.ticker] = { qty: 0, totalCostPHP: 0 };
            pos[ev.ticker].qty += ev.qty; pos[ev.ticker].totalCostPHP += bCost;
            out.cashBefore = runCash; runCash -= bCost; out.cashAfter = runCash;
            out.flowAmt = -bCost; out.costPHP = bCost; out.fee = toPHP(bFee, ex, fxRate);
            out.story = 'Bought ' + ev.ticker + ' \u00d7' + f0(ev.qty) + ' @ ' + sym + f4(ev.price) + ' = \u20b1' + f2(bCost) + ' (fee \u20b1' + f2(toPHP(bFee, ex, fxRate)) + '). Cash left \u2192 \u20b1' + f2(runCash) + '.';
          } else if (ev.kind === 'sell') {
            var p = pos[ev.ticker];
            var sFee = calcFee('SELL', ev.price, ev.qty, psiFee, ex);
            var proc = toPHP(ev.price * ev.qty - sFee, ex, fxRate);
            var avg = p && p.qty > 0 ? p.totalCostPHP / p.qty : 0;
            var basis = avg * ev.qty;
            var pnl = proc - basis;
            if (p) { p.qty -= ev.qty; p.totalCostPHP -= basis; if (p.qty <= 0) { p.qty = 0; p.totalCostPHP = 0; } }
            out.cashBefore = runCash; runCash += proc; out.cashAfter = runCash;
            out.kind = pnl >= 0 ? 'profit' : 'loss';
            out.flowAmt = pnl; out.procPHP = proc; out.costBasis = basis; out.pnl = pnl;
            out.story = 'Sold ' + ev.ticker + ' \u00d7' + f0(ev.qty) + ' @ ' + sym + f4(ev.price) + '. Cost basis \u20b1' + f2(basis) + ', proceeds \u20b1' + f2(proc) + '. ' + (pnl >= 0 ? '\u2191 Profit +\u20b1' + f2(pnl) : '\u2193 Loss \u2212\u20b1' + f2(Math.abs(pnl))) + '. Cash \u2192 \u20b1' + f2(runCash) + '.';
          }
          return out;

      var pnlData = useMemo(function () { return enriched.filter(function (p) { return Math.abs(p.uplPHP) > 0.01; }).map(function (p) { return { label: p.ticker, v: Math.abs(p.uplPHP), color: p.uplPHP >= 0 ? '#c7e2f7' : '#5a6472' }; }); }, [enriched]);

          return { label: d.slice(5), value: val };
        });
      }, [trades, funding, psiFee, fxRate]);

        setPrefill(Object.assign({}, p, { ts: Date.now() }));
        if (addToast) addToast('Quick-Sell: ' + p.ticker, 'info');
        setTradeOpen(true);

      return (

                isAnalyticsMaximized ? (
                  <div className="panel" style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 12px', background: 'rgba(255,255,255,0.06)', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>

                      <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                        <button onMouseDown={function (e) { e.stopPropagation(); setAnalyticsMinimized(true); setAnalyticsMaximized(false); }} className="win-btn" title="Minimize"><IcMin /></button>
                        <button onMouseDown={function (e) { e.stopPropagation(); setAnalyticsMaximized(false); }} className="win-btn" title="Restore"><IcMax /></button>
                        <button onMouseDown={function (e) { e.stopPropagation(); setAnalyticsCollapsed(true); setAnalyticsMaximized(false); }} className="win-btn close" title="Close"><IcX /></button>
                      </div>
                    </div>
                    <div style={{ flex: 1, overflow: 'auto', padding: '16px 20px' }}>
                      {/* Charts Row */}
                      <AnalyticsRow pieData={pieData} pnlData={pnlData} trendData={trendData} cashTrailData={cashTrailData} isDark={isDark} compact={false} enriched={enriched} advMetrics={advMetrics} />

                      {/* Quant Metrics Grid */}
                      <div style={{ marginTop: 20, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>

                        {/* Block 1: Performance */}
                        <div style={{ background: 'rgba(255,255,255,0.025)', border: '1px solid rgba(255,255,255,0.06)', borderRadius: 10, padding: '14px 16px' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
                            <span style={{ color: '#94a3b8', fontSize: 10 }}>◆</span>
                            <span className="sec-hd tm" style={{ fontSize: 9.5 }}>Performance Metrics</span>
                          </div>
                          {(function () {
                            var closed = port.closed || [];
                            var wins = port.wins || [];
                            var totalR = trades.filter(function (t) { return (t.type || '').toUpperCase() === 'SELL'; }).length;
                            var totalB = trades.filter(function (t) { return (t.type || '').toUpperCase() === 'BUY'; }).length;
                            var wr = closed.length > 0 ? (wins.length / closed.length * 100).toFixed(1) : '—';
                            var allPnLs = cashTrailData.filter(function (d) { return d.kind === 'profit' || d.kind === 'loss'; });
                            var totalRPnL = allPnLs.reduce(function (s, d) { return s + (d.pnl || 0); }, 0);
                            var avgPerTrade = allPnLs.length ? totalRPnL / allPnLs.length : 0;
                            var profitTrades = cashTrailData.filter(function (d) { return d.kind === 'profit'; });
                            var lossTrades = cashTrailData.filter(function (d) { return d.kind === 'loss'; });
                            var rows = [
                              ['Win Rate', wr + (wr !== '—' ? '%' : ''), closed.length > 0 && wins.length / closed.length >= 0.5 ? '#c7e2f7' : '#5a6472'],
                              ['Profit Factor', advMetrics ? (advMetrics.profitFactor >= 999 ? '∞' : advMetrics.profitFactor.toFixed(2)) : '—', (advMetrics && advMetrics.profitFactor >= 1) ? '#c7e2f7' : '#f43f5e'],
                              ['Max Drawdown', advMetrics ? advMetrics.maxDrawdown.toFixed(1) + '%' : '—', (advMetrics && advMetrics.maxDrawdown > 20) ? '#f43f5e' : '#94a3b8'],
                              ['Total Closed', closed.length, '#94a3b8'],
                              ['Winning Trades', profitTrades.length, '#c7e2f7'],
                              ['Losing Trades', lossTrades.length, '#f43f5e'],
                              ['Avg P&L / Trade', (avgPerTrade >= 0 ? '+' : '') + '₱' + f2(Math.abs(avgPerTrade)), avgPerTrade >= 0 ? '#c7e2f7' : '#f43f5e'],
                              ['Total Realized', (totalRPnL >= 0 ? '+' : '') + '₱' + f2(Math.abs(totalRPnL)), totalRPnL >= 0 ? '#c7e2f7' : '#f43f5e'],
                              ['Buy Orders', totalB, '#94a3b8'],
                              ['Sell Orders', totalR, '#64748b'],
                            ];
                            return rows.map(function (r, i) {
                              return (
                                <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '4px 0', borderBottom: '1px solid rgba(255,255,255,0.03)' }}>
                                  <span className="tf" style={{ fontSize: 9, opacity: 0.7 }}>{r[0]}</span>
                                  <span className="mono" style={{ fontSize: 10, fontWeight: 700, color: r[2] }}>{r[1]}</span>
                                </div>
                              );
                            });
                          })()}

        saveMock(mockTrades.concat([t]));
        addToast('[MOCK] ' + side + ' ' + f0(t.qty) + ' ' + t.ticker, 'info');
      }

      /* ── Price refresh ── */
      function doRefresh() {
        var all = enriched.concat(mockEnriched);
        if (!all.length) { addToast('No positions to refresh', 'warn'); return; }
        setRefreshing(true);
        fetchPrices(all, useIBKR).then(function (res) {
          setRefreshing(false);
          if (!res) { addToast('Price fetch failed — Manual Mode', 'err'); return; }
          setMktPx(function (prev) { return Object.assign({}, prev, res.updated); });
          var n = Object.keys(res.updated).length;
          var source = useIBKR ? 'NASDAQ' : 'Yahoo/Phisix';
          if (!res.pseFailed && !res.globalFailed) addToast('✓ Prices updated via ' + source + ' (' + n + ' tickers)', 'ok');
          else if (res.pseFailed && !res.globalFailed) addToast('Global OK · PSE sync failed', 'warn');
          else if (!res.pseFailed && res.globalFailed) addToast('PSE OK · Global sync failed', 'warn');
          else addToast('Price fetch failed — Manual Mode', 'err');
        }).catch(function (err) {
          setRefreshing(false);
          console.error('[Refresh Error]', err);
          addToast('Price fetch failed', 'err');
        });
      }

      /* V1.3.4: Auto-refresh timer for Live Prices */
      useEffect(function () {
        var interval = setInterval(function () {
          if (enriched.length > 0 || mockEnriched.length > 0) {
            doRefresh();
          }
        }, 60000); /* 60 seconds */
        return function () { clearInterval(interval); };
      }, [enriched.length, mockEnriched.length]);

      function resetAll() { if (!window.confirm('Delete ALL live data?')) return;[K.t, K.f, K.ok].forEach(function (k) { localStorage.removeItem(k); }); setTrades([]); setFunding([]); addToast('Terminal reset', 'info'); }
      function resetMock() { if (!window.confirm('Delete all Study Lab data?')) return; localStorage.removeItem(K.mock); setMockTrades([]); addToast('Study Lab cleared', 'info'); }
      function cloneToLab() {
        if (!window.confirm('Clone all live trades to Study Lab? This will overwrite current lab data.')) return;
        saveMock(JSON.parse(JSON.stringify(trades)));
        addToast('Multiverse Synced: Live data cloned to Lab', 'ok');
      }

      var today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      var sortedTrades = useMemo(function () { return trades.filter(function (t) { return t && typeof t === 'object'; }).slice().sort(function (a, b) { return +(new Date((b.date || '') + 'T' + (b.time || '00:00'))) - (+(new Date((a.date || '') + 'T' + (a.time || '00:00')))); }); }, [trades]);
      var sortedFunding = useMemo(function () { return funding.slice().sort(function (a, b) { return +(new Date(b.date || '')) - (+(new Date(a.date || ''))); }); }, [funding]);

      /* HUD colours */
      var cashRatio = port.cashPHP / Math.max(totalEqPHP, 1);
      var cashHudCls = cashRatio > .15 ? 'hud-emerald' : cashRatio < .05 ? 'hud-rose' : 'hud-amber';
      var pnlCls = realPnLPHP >= 0 ? 'hud-emerald' : 'hud-rose';
      var winCls = winRate >= 60 ? 'hud-emerald' : winRate >= 40 ? 'hud-amber' : 'hud-rose';
      var topConc = enriched.length ? enriched.reduce(function(a,b){return b.mvPHP > a.mvPHP ? b : a;}, {mvPHP:0, ticker:'None'}) : {mvPHP:0, ticker:'None'};
      topConc.share = totalMVPHP > 0 ? (topConc.mvPHP / totalMVPHP * 100) : 0;

      /* ══════════════════════════════════════════
         RENDER
      ══════════════════════════════════════════ */
      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative', zIndex: 1 }}>

          {/* FX Modal */}

                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span style={{ fontSize: 12.5, fontWeight: 700 }} className="tp">FX Rate Settings</span>
                  <button className="ic" onClick={function () { setShowFx(false); }}><IcX /></button>
                </div>
                <div style={{ height: 1 }} className="divl" />
                <F label="USD / PHP Rate (₱ per $1)">
                  <input type="number" step="0.5" min="1" className="inp" value={fxRate} onChange={function (e) { setFxRate(Math.max(1, parseFloat(e.target.value) || 60)); }} />
                </F>
                <div className="inset" style={{ padding: '7px 10px' }}>
                  <div className="tm" style={{ fontSize: 9.5 }}>All USD, Crypto, and Forex positions convert to ₱ at this rate across the HUD and Ledger.</div>
                </div>
                <button className="btn btn-blue" onClick={function () { setShowFx(false); }} style={{ width: '100%' }}>Done</button>
              </div>
            </div>

          {/* Settings Modal */}
          {showSettings && (

                  <button className="ic" onClick={function () { setShowSettings(false); }}><IcX /></button>

                <div style={{ height: 1 }} className="divl" />

                <F label="Font Size Scaling">
                  <div className="seg-w" style={{ gridTemplateColumns: '1fr 1fr 1fr' }}>

                      { v: 'medium', l: 'Medium' },
                      { v: 'large', l: 'Large' }

                <div className="inset" style={{ padding: '8px 12px' }}>

                <button className="btn btn-blue" onClick={function () { setShowSettings(false); }} style={{ width: '100%' }}>Done</button>
              </div>
            </div>

          {/* ═══ NAVBAR ═══ */}
          <nav className="nav-bar" style={{ height: 'var(--nav-h)', flexShrink: 0, position: 'relative', zIndex: 50, display: 'flex', alignItems: 'center', padding: '0 var(--pad)', gap: 4 }}>

                <defs><linearGradient id="bj151logo" x1="0" y1="0" x2="24" y2="24"><stop stopColor="#c7e2f7" /><stop offset="1" stopColor="#3b82f6" /></linearGradient></defs>
                <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" stroke="url(#bj151logo)" strokeWidth="1.5" fill="rgba(16,185,129,.07)" style={{ filter: 'drop-shadow(0 0 5px rgba(16,185,129,.5))' }} />

              <button id="ibkr-toggle" onClick={function () { setUseIBKR(function (v) { return !v; }); }}
                className={useIBKR ? 'ibkr-on' : 'ibkr-off'}
                title={useIBKR ? 'Using NASDAQ Live Prices' : 'Using Yahoo/Phisix Prices'}
                style={{ padding: '2px 8px', borderRadius: '.4rem', cursor: 'pointer', fontFamily: 'Geist Mono,monospace', fontSize: 8, fontWeight: 700, letterSpacing: '.04em', transition: 'all .18s', background: useIBKR ? (isDark ? 'rgba(110,231,183,.12)' : 'rgba(110,231,183,.09)') : (isDark ? 'rgba(148,163,184,.08)' : 'rgba(148,163,184,.06)'), border: useIBKR ? (isDark ? '1px solid rgba(110,231,183,.3)' : '1px solid rgba(110,231,183,.25)') : (isDark ? '1px solid rgba(148,163,184,.15)' : '1px solid rgba(148,163,184,.12)'), color: useIBKR ? (isDark ? '#6ee7b7' : '#065f46') : (isDark ? '#94a3b8' : '#64748b') }}>
                {useIBKR ? 'NASDAQ' : 'Yahoo'}
              </button>
              <button id="usd-view-btn" onClick={function () { setUsdView(function (v) { return !v; }); }} className={'usd-toggle' + (usdView ? ' on' : '')}>{usdView ? '$ USD VIEW' : '₱ PHP VIEW'}</button>
              <button id="reset-btn" onClick={resetAll} className="ghost tm" style={{ padding: '2px 8px', borderRadius: '.4rem', cursor: 'pointer', fontFamily: 'Inter,sans-serif', fontSize: 9, fontWeight: 500, transition: 'all .15s' }}>Reset</button>
            </div>
          </nav>

          {/* ═══ HUD ═══ */}
          <div className="hud-bar" id="global-hud" style={{ height: 'var(--hud-h)', flexShrink: 0, position: 'relative', zIndex: 40, display: 'flex', alignItems: 'stretch' }}>
            {[
              { id: 'hud-equity', l: 'Total Equity', v: displayVal(totalEqPHP), sub: pct(exposure) + ' in market', cls: 'hud-violet' },
              { id: 'hud-cash', l: 'Available Cash', v: usdView ? '$' + f2(port.cashUSD + (port.cashPHP / fxRate)) : '₱' + f0(port.cashPHP + (port.cashUSD * fxRate)), sub: 'NET LIQUIDITY', cls: cashHudCls },
              { id: 'hud-rpnl', l: 'Realized P&L', v: displayVal(realPnLPHP), sub: 'ROI ' + sgn(roiPct) + pct(roiPct), cls: pnlCls },
              { id: 'hud-win', l: 'Win Rate', v: pct(winRate), sub: port.wins.length + 'W / ' + (port.closed.length - port.wins.length) + 'L', cls: winCls },
              { id: 'hud-mv', l: 'Market Value', v: displayVal(totalMVPHP), sub: enriched.length + ' pos · FX ₱' + fxRate.toFixed(0) + '/$', cls: 'hud-blue' },
            ].map(function (c, i) {
              return (
                <React.Fragment key={i}>
                  {i > 0 && <div className="divl" />}
                  <div id={c.id} style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '0 var(--pad)', flex: 1, minWidth: 0 }}>
                    <div className="sec-hd tf" style={{ marginBottom: 1 }}>{c.l}</div>
                    <N v={c.v} priv={priv} cls={c.cls} style={{ fontSize: 'var(--fz-hud)', fontWeight: 700, lineHeight: 1.2 }} />
                    <div className="mono tf" style={{ fontSize: 7.5, marginTop: 1 }}>{c.sub}</div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>

          {/* ═══ WORKSPACE ═══ */}
          <div style={{ flex: 1, minHeight: 0, overflow: 'hidden', position: 'relative', zIndex: 1 }}>

            {/* ─── DASHBOARD (live) ─── */}
            {view === 'dashboard' && (
              <DashboardBody
                enriched={enriched} port={port} trades={trades} funding={funding}
                tickerLists={tickerLists} mktPx={mktPx} setMktPx={setMktPx}
                psiFee={psiFee} fxRate={fxRate} isDark={isDark} priv={priv} scale={scale}
                addTicker={addTicker} deleteTicker={deleteTicker}
                onExecTrade={execLiveTrade} isMock={false}
                savedScenarios={savedScenarios} setSavedScenarios={setSavedScenarios} addToast={addToast}
                saveTrades={save}
              />
            )}

            {/* ─── LEDGER ─── */}
            {view === 'ledger' && (
              <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                <div style={{ flexShrink: 0, padding: '8px var(--pad)', borderBottom: '1px solid rgba(255,255,255,0.06)', display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span className="sec-hd tm">Trade Ledger</span>
                    <span className="mono tf" style={{ fontSize: 8 }}>{trades.length} records</span>
                  </div>
                  <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
                    <button onClick={function () { setShowLedgerPerf(function (v) { return !v; }); }} className="ghost tm" style={{ padding: '3px 10px', borderRadius: '4px', fontSize: 9, fontWeight: 600, border: '1px solid rgba(255,255,255,0.1)', background: showLedgerPerf ? 'rgba(199,226,247,0.1)' : 'transparent', color: showLedgerPerf ? '#c7e2f7' : '#94a3b8' }}>

                <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>
                  <div style={{ flex: 1, padding: 'var(--pad)', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                    {sortedTrades.length === 0
                      ? <div className="glass" style={{ flex: 1 }}><Empty msg="No trades recorded" sub="Execute an order on the Dashboard" /></div>
                      : (
                        <div className="glass fu scroll" style={{ flex: 1, overflow: 'auto', background: isDark ? 'rgba(0,0,0,0.2)' : '#fff' }}>
                          <table className="tbl accounting-tbl" style={{ width: '100%', borderCollapse: 'collapse' }}>
                            <thead style={{ position: 'sticky', top: 0, zIndex: 10, background: isDark ? '#111' : '#f8fafc' }}>
                              <tr>
                                {['DATE/TIME', 'TYPE', 'EXCH', 'TICKER', 'PRICE', 'QTY', 'GROSS', 'FEE', 'NET PHP', 'MEMO'].map(function (h) {
                                  return <th key={h} className="th mono" style={{ fontSize: 8, textAlign: 'left', padding: '10px 12px', borderBottom: '1px solid rgba(255,255,255,0.08)', color: '#64748b' }}>{h}</th>;
                                })}
                              </tr>
                            </thead>
                            <tbody>
                              {sortedTrades.map(function (t, i) {

                                    <td className="td mono tf" style={{ fontSize: 9 }}>{sm}{f2(gross)}</td>
                                    <td className="td mono" style={{ fontSize: 8.5, color: '#f59e0b' }}>{sm}{f2(fee)}</td>

                      </div>

                      <div className="glass" style={{ padding: '14px', borderRadius: 12 }}>
                        <div className="tm" style={{ fontSize: 8, letterSpacing: '.10em', textTransform: 'uppercase', marginBottom: 12, opacity: 0.6 }}>Asset Exposure</div>
                        {(function () {
                          var dist = enriched.map(function(p){ return { label: p.ticker, v: p.mvPHP }; });
                          return <PieChart data={dist} size={140} isDark={isDark} title="Assets" />;
                        })()}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ─── WALLET ─── */}
            {view === 'wallet' && (
              <div style={{ padding: 'var(--pad)', height: '100%', overflow: 'hidden', display: 'grid', gridTemplateColumns: '280px 1fr 230px', gap: 'var(--gap)' }}>
                <div className="glass scroll" style={{ padding: 'var(--pad)', display: 'flex', flexDirection: 'column', gap: 'var(--gap)', overflow: 'auto' }}>
                  <span className="sec-hd tm">Fund Account</span>
                  <div className="seg-w" style={{ gridTemplateColumns: '1fr 1fr' }}>
                    {['DEPOSIT', 'WITHDRAW'].map(function (v) { return (<button key={v} onClick={function () { setWType(v); }} className={'seg-b ' + (v === 'DEPOSIT' ? 'dep' : 'wdw') + (wType === v ? ' on' : '')}>{v === 'DEPOSIT' ? '+ Deposit' : '− Withdraw'}</button>); })}
                  </div>
                  <F label="Currency">
                    <div className="seg-w" style={{ gridTemplateColumns: '1fr 1fr' }}>
                      {['PHP', 'USD'].map(function (c) { return (<button key={c} onClick={function () { setWCurrency(c); }} className={'seg-b dep' + (wCurrency === c ? ' on' : '')} style={{ fontSize: 9 }}>{c === 'PHP' ? '₱ PHP' : '$ USD'}</button>); })}
                    </div>
                  </F>
                  <F label={'Amount (' + (wCurrency === 'USD' ? '$' : '₱') + ')'}>
                    <input id="wallet-amount" type="number" step="1000" min="0" className="inp" placeholder="0.00" value={wAmt} onChange={function (e) { setWAmt(e.target.value); }} />
                  </F>
                  <F label="Source">
                    <select className="inp" value={wSrc} onChange={function (e) { setWSrc(e.target.value); }}>
                      {SOURCES.map(function (s) { return <option key={s} value={s}>{s}</option>; })}
                    </select>
                  </F>
                  <F label="Date"><input type="date" className="inp" value={wDate} onChange={function (e) { setWDate(e.target.value); }} /></F>
                  <F label="Memo"><input type="text" className="inp" placeholder="Optional…" value={wNote} onChange={function (e) { setWNote(e.target.value); }} /></F>
                  <button id="wallet-submit" onClick={execWallet} disabled={!parseFloat(wAmt) || parseFloat(wAmt) <= 0}
                    className={'btn ' + (wType === 'DEPOSIT' ? 'btn-buy' : 'btn-sell')} style={{ width: '100%' }}>
                    {wType === 'DEPOSIT' ? '↓  RECORD DEPOSIT' : '↑  RECORD WITHDRAWAL'}
                  </button>
                  <div className="inset" style={{ padding: '10px 11px' }}>
                    {[['Total Deposited', '#c7e2f7', '+₱' + f2(port.totalDep)], ['Total Withdrawn', '#5a6472', '-₱' + f2(port.totalWdw)], ['PHP Cash', '#3b82f6', '₱' + f2(port.cashPHP)], ['USD Cash', '#60a5fa', '$' + f2(port.cashUSD)]].map(function (item, idx) {
                      return (
                        <div key={item[0]} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', borderTop: idx > 0 ? '1px solid rgba(128,128,128,.09)' : 'none' }}>
                          <span className="tm" style={{ fontSize: 9.5 }}>{item[0]}</span>
                          <N v={item[2]} priv={priv} style={{ fontSize: 12.5, fontWeight: 700, color: item[1], textShadow: isDark ? '0 0 7px ' + item[1] + '55' : 'none' }} />
                        </div>
                      );
                    })}
                  </div>
                </div>
                <div className="glass" style={{ overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                  <div style={{ padding: 'var(--pad)', paddingBottom: 5, flexShrink: 0 }}>
                    <span className="sec-hd tm">Funding History <span className="tf" style={{ marginLeft: 3, fontWeight: 400 }}>{funding.length}</span></span>
                  </div>
                  <div className="scroll" style={{ flex: 1, overflow: 'auto' }}>
                    <table className="tbl">
                      <thead><tr><th className="th">Date</th><th className="th">Type</th><th className="th">Cur.</th><th className="th">Source</th><th className="th">Amount</th><th className="th">Memo</th></tr></thead>
                      <tbody>
                        {sortedFunding.length === 0 && <tr className="tdb"><td colSpan={6} className="td tf" style={{ textAlign: 'center', padding: '36px', fontFamily: 'Inter,sans-serif' }}>No records yet</td></tr>}
                        {sortedFunding.map(function (ff, i) {
                          var isU = ff && (ff.currency || 'PHP').toUpperCase() === 'USD';
                          var sm = isU ? '$' : '₱';
                          return (
                            <tr key={(ff && ff.id) || i} className="tr-h tdb">
                              <td className="td mono tm" style={{ fontSize: 10 }}>{(ff && ff.date) || ''}</td>
                              <td className="td"><span className={'tag tag-' + ((ff && ff.type) === 'DEPOSIT' ? 'dep' : 'wdw')}>{(ff && ff.type) || ''}</span></td>
                              <td className="td"><span className={isU ? 'hud-badge hud-usd-badge' : 'hud-badge hud-php-badge'} style={{ fontSize: 7 }}>{isU ? 'USD' : 'PHP'}</span></td>
                              <td className="td ts" style={{ fontFamily: 'Inter,sans-serif', fontWeight: 500 }}>{(ff && ff.source) || ''}</td>
                              <td className="td"><N v={(ff && ff.type) === 'DEPOSIT' ? ('+' + sm + f2(ff && ff.amount)) : ('−' + sm + f2(ff && ff.amount))} priv={priv} style={{ color: (ff && ff.type) === 'DEPOSIT' ? '#c7e2f7' : '#5a6472', fontWeight: 700 }} /></td>
                              <td className="td tf" style={{ fontSize: 9, fontFamily: 'Inter,sans-serif' }}>{(ff && ff.note) || '—'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
                <div className="glass" style={{ padding: 'var(--pad)', overflow: 'hidden' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    <div className="tm" style={{ fontSize: 7.5, letterSpacing: '.10em', textTransform: 'uppercase' }}>Wallet Analytics</div>
                    {(function () {
                      var fs = getFundingStats(funding);
                      return fs.sources.map(function (s, i) {
                        var w = fs.totalIn > 0 ? (s.amount / fs.totalIn) * 100 : 0;
                        return (<div key={i} style={{ marginBottom: 7 }}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}><span className="ts" style={{ fontSize: 9.5, fontFamily: 'Inter,sans-serif' }}>{s.name}</span><N v={'₱' + f2(s.amount)} priv={priv} cls="tf" style={{ fontSize: 9 }} /></div><div className="src-bar-track" style={{ height: 3 }}><div style={{ height: '100%', borderRadius: 99, width: w + '%', background: PIE_COLORS[i % PIE_COLORS.length] }} /></div></div>);
                      });
                    })()}
                  </div>
                </div>
              </div>
            )}

            {/* ─── 📐 STUDY LAB (Mock Portfolio) ─── */}
            {view === 'studylab' && (
              <div style={{ height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
                {/* Study Lab HUD */}
                <div style={{ flexShrink: 0, padding: '8px var(--pad)', background: isDark ? 'rgba(139,92,246,.07)' : 'rgba(139,92,246,.05)', borderBottom: '1px solid rgba(139,92,246,.18)', display: 'flex', alignItems: 'center', gap: 12 }}>
                  <IcFlask /><span style={{ fontSize: 10.5, fontWeight: 700, color: '#a78bfa', letterSpacing: '.06em' }}>STUDY LAB — MOCK PORTFOLIO</span>
                  <span className="tf" style={{ fontSize: 9 }}>Virtual environment · Risk-free forward testing · Data isolated from Live Ledger</span>
                  <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span className="mono" style={{ fontSize: 10, color: '#a78bfa' }}>Positions: {mockEnriched.length}</span>
                    <span className="mono" style={{ fontSize: 10, color: '#a78bfa' }}>Trades: {mockTrades.length}</span>
                    <button onClick={cloneToLab} className="ghost" style={{ padding: '2px 8px', borderRadius: '.4rem', fontSize: 9, cursor: 'pointer', fontFamily: 'Inter,sans-serif', color: '#a78bfa', border: '1px solid rgba(167,139,250,.25)', background: 'rgba(167,139,250,.08)' }}>Clone Live to Lab</button>
                    <button onClick={resetMock} className="ghost" style={{ padding: '2px 8px', borderRadius: '.4rem', fontSize: 9, cursor: 'pointer', fontFamily: 'Inter,sans-serif', color: '#5a6472', border: '1px solid rgba(244,63,94,.20)', background: 'rgba(244,63,94,.06)' }}>Clear Lab</button>
                  </div>
                </div>
                <div style={{ flex: 1, minHeight: 0, overflow: 'hidden' }}>
                  <DashboardBody
                    enriched={mockEnriched} port={mockPort} trades={mockTrades} funding={[]}
                    tickerLists={tickerLists} mktPx={mktPx} setMktPx={setMktPx}
                    psiFee={psiFee} fxRate={fxRate} isDark={isDark} priv={priv} scale={scale}
                    addTicker={addTicker} deleteTicker={deleteTicker}
                    onExecTrade={execMockTrade} isMock={true}
                    savedScenarios={savedScenarios} setSavedScenarios={setSavedScenarios} addToast={addToast}
                    saveTrades={function (nT) { saveMock(nT); }}
                  />
                </div>
              </div>
            )}

            {/* ─── PREDICTOR ─── */}
            {view === 'sandbox' && (
              <PredictorV42
                enriched={enriched} trades={trades} usePse={psiFee} fxRate={fxRate}
                save={save} savedScenarios={savedScenarios} setSavedScenarios={setSavedScenarios}
                addToast={addToast} isDark={isDark} priv={priv}
              />
            )}
          </div>
        </div>
      );
    }

    /* ── Mount ── */
    var rootEl = document.getElementById('root');
    if (rootEl) { ReactDOM.createRoot(rootEl).render(React.createElement(App)); }

  </script>
</body>

</html>
